<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furkan Ayan</title>
  <meta name="description" content="Apps by Furkan Ayan.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="salvation/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <style>
    :root {
      --bg: #0d0e10;
      --card: #16181b;
      --line: #25282d;
      --text: #f2f2f0;
      --muted: #9a9ea6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    main { width: 100%; max-width: 640px; padding: 72px 16px 48px; }
    h1 { margin: 0; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }
    .lead { margin: 6px 0 40px; color: var(--muted); }
    .apps { display: grid; gap: 12px; }
    .app {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }
    .app:hover { border-color: #3a3e45; transform: translateY(-1px); }
    .app img { width: 56px; height: 56px; border-radius: 13px; flex: none; }
    .app strong { display: block; font-size: 17px; font-weight: 600; }
    .app span { color: var(--muted); font-size: 14px; }
    footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Furkan Ayan</h1>
    <p class="lead">Apps I make.</p>
    <div class="apps">
      <a class="app" href="salvation/">
        <img src="salvation/assets/img/app-icon.webp" alt="">
        <div><strong>Salvation</strong><span>Daily verses, a prayer room and the Quran.</span></div>
      </a>
      <a class="app" href="plobi/">
        <img src="plobi/logo1.png" alt="">
        <div><strong>Plobi</strong><span>Turn your ideas into images in seconds.</span></div>
      </a>
    </div>
    <footer>Contact: <a href="mailto:support@furkanayan.app">support@furkanayan.app</a></footer>
  </main>
</body>
</html>
